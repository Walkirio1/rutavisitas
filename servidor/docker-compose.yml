services:
  verific:
    build: .
    container_name: verific
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ${DATOS_DIR:-./datos}:/datos   # dónde se guardan los datos (en .env: DATOS_DIR=/datos/verific)
      - ..:/web:ro   # la app (para servirla en /app/)
    environment:
      - APP_DIR=/web
